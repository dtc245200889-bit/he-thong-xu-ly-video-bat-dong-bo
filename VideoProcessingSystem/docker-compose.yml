services:
  rabbitmq:
    image: rabbitmq:4-management
    container_name: video-processing-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: video_demo
      RABBITMQ_DEFAULT_PASS: video_demo_password
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  rabbitmq-data:
